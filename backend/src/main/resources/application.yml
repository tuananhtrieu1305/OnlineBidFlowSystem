server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: OBFSESSION
        http-only: true
        secure: true
        same-site: none

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: auction-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auction_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:auction_user}
    password: ${DB_PASSWORD:auction_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

app:
  products:
    image-dir: ${PRODUCT_IMAGE_DIR:.runtime/product-images}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,app://auction}
