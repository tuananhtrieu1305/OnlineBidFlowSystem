services:
  mysql:
    image: mysql:8.4.4
    container_name: auction_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-auction_db}
      MYSQL_USER: ${MYSQL_USER:-auction_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-auction_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: auction_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-auction_db}
      DB_USERNAME: ${DB_USERNAME:-auction_user}
      DB_PASSWORD: ${DB_PASSWORD:-auction_password}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,app://auction}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
