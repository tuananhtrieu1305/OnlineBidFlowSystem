name: Desktop base
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  registration-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4.4
        env:
          MYSQL_ROOT_PASSWORD: registration_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pregistration_test_only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: auction_db
      DB_USERNAME: root
      DB_PASSWORD: registration_test_only
      REGISTRATION_TEST_DATABASE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Initialize isolated CI database
        env:
          MYSQL_PWD: registration_test_only
        run: mysql -h 127.0.0.1 -uroot < database/init.sql
      - name: Registration integration tests
        run: mvn -B -ntp -f backend/pom.xml -Pregistration-it verify
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Spring Boot
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Install desktop dependencies
        working-directory: frontend
        run: npm ci
      - name: Check unit tests and coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Check Electron with Spring Boot
        working-directory: frontend
        run: npm run test:e2e
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit
      - name: Build Windows installer
        working-directory: frontend
        run: npm run dist:win
      - name: Check packaged desktop
        working-directory: frontend
        shell: pwsh
        run: |
          $env:E2E_EXECUTABLE = (Resolve-Path 'release/win-unpacked/OnlineBidFlow.exe').Path
          npx playwright test
