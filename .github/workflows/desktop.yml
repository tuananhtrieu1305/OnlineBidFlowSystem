name: Desktop base
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Spring Boot
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Install desktop dependencies
        working-directory: frontend
        run: npm ci
      - name: Check unit tests and coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Check Electron with Spring Boot
        working-directory: frontend
        run: npm run test:e2e
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit
      - name: Build Windows installer
        working-directory: frontend
        run: npm run dist:win
      - name: Check packaged desktop
        working-directory: frontend
        shell: pwsh
        run: |
          $env:E2E_EXECUTABLE = (Resolve-Path 'release/win-unpacked/OnlineBidFlow.exe').Path
          npx playwright test
